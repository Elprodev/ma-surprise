<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biloa Ndjem Elisee Carmel</title>
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #3c1053, #ad5389, #d81b60, #ff9999);
            background-size: 500%;
            font-family: 'Sacramento', cursive;
            overflow: hidden;
            animation: gradientFlow 20s ease infinite;
        }

        .container {
            text-align: center;
            color: #fff;
            z-index: 1;
            animation: fadeIn 4s ease-in-out;
        }

        h1 {
            font-size: 6rem;
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 20, 147, 0.9), 0 0 50px rgba(255, 20, 147, 0.7);
            padding: 30px 60px;
            border-radius: 30px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            transition: transform 0.5s ease, text-shadow 0.5s ease;
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            animation: typewriter 3s steps(40, end) forwards, sparkle 2s infinite;
        }

        h1:hover {
            transform: scale(1.05);
            text-shadow: 0 0 35px rgba(255, 20, 147, 1), 0 0 60px rgba(255, 20, 147, 0.8);
        }

        .love-messages {
            margin-top: 20px;
        }

        .love-message {
            font-size: 2.3rem;
            color: #ffb6c1;
            text-shadow: 0 0 15px rgba(255, 182, 193, 0.8);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInMessage 3s ease-in-out forwards;
        }

        .love-message:nth-child(1) { animation-delay: 3s; }
        .love-message:nth-child(2) { animation-delay: 4.5s; }
        .love-message:nth-child(3) { animation-delay: 6s; }

        /* Gradient background animation */
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Typewriter animation */
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }

        /* Sparkle effect */
        @keyframes sparkle {
            0% { text-shadow: 0 0 25px rgba(255, 20, 147, 0.9), 0 0 50px rgba(255, 20, 147, 0.7); }
            50% { text-shadow: 0 0 30px rgba(255, 20, 147, 1), 0 0 60px rgba(255, 20, 147, 0.9); }
            100% { text-shadow: 0 0 25px rgba(255, 20, 147, 0.9), 0 0 50px rgba(255, 20, 147, 0.7); }
        }

        /* Message fade-in */
        @keyframes fadeInMessage {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Particle canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3.8rem;
                padding: 20px 40px;
            }
            .love-message {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.8rem;
                padding: 15px 30px;
            }
            .love-message {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <div class="container">
        <h1>Feugang Wobiwo Lyrette Joys</h1>
        <div class="love-messages">
            <p class="love-message">Ton sourire est ma lumière dans l'obscurité</p>
            <p class="love-message">Chaque battement de mon cœur murmure ton nom</p>
            <p class="love-message">Avec toi, chaque instant est une éternité d'amour</p>
            <p class="love-message">Je t'aime trop ma petite sorcière d'amour</p>
        </div>
    </div>
    <script>
        // Enhanced heart-shaped particle animation with twinkle
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 120;

        class Particle {
            constructor() {
                this.reset();
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.2 - 0.1;
                this.speedY = Math.random() * 0.2 - 0.1;
                this.color = `hsl(${Math.random() * 20 + 340}, 90%, 85%)`;
                this.opacity = Math.random() * 0.4 + 0.6;
                this.twinklePhase = Math.random() * Math.PI * 2;
            }

            reset() {
                // Heart shape parametric equations
                const t = Math.random() * Math.PI * 2;
                const scale = Math.random() * 70 + 70;
                this.x = canvas.width / 2 + scale * (16 * Math.pow(Math.sin(t), 3)) / 16;
                this.y = canvas.height / 2 - scale * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.twinklePhase += 0.05;
                this.opacity = 0.6 + Math.sin(this.twinklePhase) * 0.2;

                if (this.size > 0.2) this.size -= 0.015;

                // Reset particle if it fades or moves too far
                if (this.size <= 0.2 || Math.abs(this.x - canvas.width / 2) > canvas.width / 2 || Math.abs(this.y - canvas.height / 2) > canvas.height / 2) {
                    this.reset();
                    this.size = Math.random() * 2 + 1;
                    this.opacity = Math.random() * 0.4 + 0.6;
                }
            }

            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            const maxDistance = 90;
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        ctx.globalAlpha = (1 - distance / maxDistance) * 0.3;
                        ctx.strokeStyle = `rgba(255, 182, 193, ${1 - distance / maxDistance})`;
                        ctx.lineWidth = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle) => {
                particle.update();
                particle.draw();
            });
            connectParticles();
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
